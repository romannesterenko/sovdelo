name: sovdelo
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sovdelo}
      POSTGRES_USER: ${DB_USERNAME:-sovdelo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - sovdelo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  sovdelo_pg:
