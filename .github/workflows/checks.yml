name: SovDelo checks and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Laravel PostgreSQL tests and Vue build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: sovdelo-${{ github.ref }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sovdelo_testing
          POSTGRES_USER: sovdelo_testing
          POSTGRES_PASSWORD: ci_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sovdelo_testing -d sovdelo_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: sovdelo_testing
      DB_USERNAME: sovdelo_testing
      DB_PASSWORD: ci_ephemeral_password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: '4'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, curl, dom, xml, zip, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Check shell scripts and tracked files
        run: |
          for file in setup.sh test.sh scripts/*.sh deploy/*.sh deploy/server/*.sh deploy/local/*.sh; do bash -n "$file"; done
          bash scripts/check-git.sh
      - name: Deployment archive validation tests
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'
      - name: Frontend tests
        run: npm run test:frontend
      - name: Build Vue and validate TypeScript
        run: npm run build
      - name: Laravel tests
        run: php artisan test --filter=WorkspaceTest

      - name: Package tested commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 deploy/build-artifact.py /tmp/sovdelo-release.tar.gz "$GITHUB_SHA"
      - name: Deploy SovDelo production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.SOVDELO_HOST }}
          DEPLOY_KEY: ${{ secrets.SOVDELO_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SOVDELO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Configure SOVDELO_HOST, SOVDELO_SSH_KEY and SOVDELO_KNOWN_HOSTS'; exit 1; }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/sovdelo_actions"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/sovdelo_actions" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/sovdelo_actions"' EXIT
          ssh -T -i "$HOME/.ssh/sovdelo_actions" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "root@$DEPLOY_HOST" "deploy $GITHUB_SHA $GITHUB_RUN_NUMBER" < /tmp/sovdelo-release.tar.gz
